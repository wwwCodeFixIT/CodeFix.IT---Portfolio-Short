    <!-- Basic Consent Mode v2: do not load the Analytics library before opt-in. -->
    <script>
      (function () {
        var measurementId = 'G-HBPBYSGBPS';
        var storageKey = 'codefix_analytics_consent_v1';
        var choice = null;
        try {
          var stored = window.localStorage.getItem(storageKey);
          if (stored === 'accepted' || stored === 'rejected') choice = stored;
        } catch (error) {
          // Storage may be disabled; the visitor can still make a session-only choice.
        }

        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('consent', 'default', {
          analytics_storage: 'denied',
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
          wait_for_update: 500
        });
        window.gtag('set', 'ads_data_redaction', true);
        window.codefixAnalyticsAllowed = false;
        window.codefixConsentChoice = choice;

        var initialized = false;
        var analyticsPageViewSent = false;

        function loadGoogleTag(sendPageView) {
          if (!initialized) {
            initialized = true;
            analyticsPageViewSent = Boolean(sendPageView);
            window.gtag('js', new Date());
            window.gtag('config', measurementId, { send_page_view: Boolean(sendPageView) });
            var script = document.createElement('script');
            script.async = true;
            script.src = 'https://www.googletagmanager.com/gtag/js?id=' + measurementId;
            document.head.appendChild(script);
            return;
          }

          if (sendPageView && !analyticsPageViewSent) {
            analyticsPageViewSent = true;
            window.gtag('config', measurementId);
          }
        }

        function startAnalytics() {
          window.codefixAnalyticsAllowed = true;
          window.gtag('consent', 'update', { analytics_storage: 'granted' });
          loadGoogleTag(true);
        }

        function clearAnalyticsCookies() {
          var cookieNames = document.cookie.split(';').map(function (part) {
            return part.trim().split('=')[0];
          }).filter(function (name) {
            return name === '_ga' || name.indexOf('_ga_') === 0;
          });
          var domains = ['', 'codefix.it', '.codefix.it'];
          cookieNames.forEach(function (name) {
            domains.forEach(function (domain) {
              document.cookie = name + '=; Max-Age=0; Path=/; SameSite=Lax' +
                (domain ? '; Domain=' + domain : '');
            });
          });
        }

        window.codefixSetGoogleAdConsent = function (allowed) {
          var value = allowed ? 'granted' : 'denied';
          window.gtag('consent', 'update', {
            ad_storage: value,
            ad_user_data: value,
            ad_personalization: value
          });
          window.gtag('set', 'ads_data_redaction', !allowed);

          // Ads consent must be able to measure a lead even when Analytics
          // consent stays denied. Load the consent-aware Google tag without
          // sending an Analytics page_view in that case.
          if (allowed) loadGoogleTag(false);
        };

        window.codefixSetAnalyticsConsent = function (nextChoice, deferReload) {
          if (nextChoice !== 'accepted' && nextChoice !== 'rejected') return;
          var wasInitialized = initialized;
          window.codefixConsentChoice = nextChoice;
          try {
            window.localStorage.setItem(storageKey, nextChoice);
          } catch (error) {
            // Persist for this page only when storage is unavailable.
          }

          if (nextChoice === 'accepted') {
            startAnalytics();
            return;
          }

          window.codefixAnalyticsAllowed = false;
          window.gtag('consent', 'update', { analytics_storage: 'denied' });
          clearAnalyticsCookies();
          // A loaded third-party script cannot be unloaded; reload without it on withdrawal.
          if (wasInitialized && !deferReload) window.location.reload();
        };

        if (choice === 'accepted') startAnalytics();

        document.addEventListener('click', function (event) {
          if (!window.codefixAnalyticsAllowed) return;
          var target = event.target instanceof Element ? event.target.closest('a') : null;
          if (!target) return;
          var href = target.getAttribute('href') || '';
          if (href.startsWith('mailto:')) {
            window.gtag('event', 'contact_click', {
              event_category: 'lead',
              link_text: target.textContent ? target.textContent.trim() : '',
              link_url: href
            });
          }
          if (href === '#contact' || href === '#kontakt') {
            window.gtag('event', 'contact_cta_click', {
              event_category: 'lead',
              link_text: target.textContent ? target.textContent.trim() : '',
              page_path: window.location.pathname
            });
          }
        });
      })();
    </script>

    <!-- OpenAI ad measurement has its own opt-in, independent of Analytics. -->
    <script>
      (function () {
        var storageKey = 'codefix_ad_measurement_consent_v1';
        var choice = null;
        var initialized = false;
        var productionHost = window.location.hostname === 'codefix.it' ||
          window.location.hostname === 'www.codefix.it';
        try {
          var stored = window.localStorage.getItem(storageKey);
          if (stored === 'accepted' || stored === 'rejected') choice = stored;
        } catch (error) {
          // A session-only choice also works when storage is unavailable.
        }
        window.codefixAdConsentChoice = choice;
        window.codefixAdMeasurementAllowed = false;

        function startAdMeasurement() {
          if (!productionHost) return;
          if (!initialized) {
            initialized = true;
            if (!window.oaiq) {
              var queue = function () { queue.q.push(arguments); };
              queue.q = [];
              window.oaiq = queue;
            }
            window.oaiq('consent', false);
            window.oaiq('init', { pixelId: '3doyPe63rTnHQdmZKh8yx3' });
            window.oaiq('consent', true);
            var script = document.createElement('script');
            script.async = true;
            script.src = 'https://bzrcdn.openai.com/sdk/oaiq.min.js';
            document.head.appendChild(script);
          } else {
            window.oaiq('consent', true);
          }
          window.codefixAdMeasurementAllowed = true;
        }

        function clearAdCookies() {
          ['__oppref', '__obref'].forEach(function (name) {
            ['', 'codefix.it', '.codefix.it'].forEach(function (domain) {
              document.cookie = name + '=; Max-Age=0; Path=/; SameSite=Lax' +
                (domain ? '; Domain=' + domain : '');
            });
          });
        }

        window.codefixSetAdMeasurementConsent = function (nextChoice, deferReload) {
          if (nextChoice !== 'accepted' && nextChoice !== 'rejected') return;
          window.codefixAdConsentChoice = nextChoice;
          try {
            window.localStorage.setItem(storageKey, nextChoice);
          } catch (error) {
            // Persist for this page only when storage is unavailable.
          }
          if (nextChoice === 'accepted') {
            window.codefixSetGoogleAdConsent?.(true);
            startAdMeasurement();
            return;
          }
          window.codefixSetGoogleAdConsent?.(false);
          window.codefixAdMeasurementAllowed = false;
          if (window.oaiq) {
            // Discard pending conversions before a queued SDK load can replay them.
            if (Array.isArray(window.oaiq.q)) {
              window.oaiq.q = window.oaiq.q.filter(function (args) {
                return args[0] !== 'measure';
              });
            }
            try { window.oaiq('consent', false); } catch (error) {
              // An unavailable measurement library must not block privacy controls.
            }
          }
          clearAdCookies();
          if (initialized && !deferReload) window.location.reload();
        };

        window.codefixSetMeasurementConsent = function (preferences) {
          if (!preferences || typeof preferences.analytics !== 'boolean' ||
              typeof preferences.ads !== 'boolean') return;
          var reload = (window.codefixAnalyticsAllowed && !preferences.analytics) ||
            (initialized && !preferences.ads);
          window.codefixSetAdMeasurementConsent(preferences.ads ? 'accepted' : 'rejected', true);
          window.codefixSetAnalyticsConsent(preferences.analytics ? 'accepted' : 'rejected', true);
          window.dispatchEvent(new Event('codefix:measurement-consent-changed'));
          if (reload) window.location.reload();
        };

        window.addEventListener('storage', function (event) {
          if (event.key === storageKey) {
            window.codefixSetAdMeasurementConsent(event.newValue === 'accepted' ? 'accepted' : 'rejected');
          }
        });

        if (choice === 'accepted') {
          window.codefixSetGoogleAdConsent?.(true);
          startAdMeasurement();
        }
        if (choice === 'rejected') {
          window.codefixSetGoogleAdConsent?.(false);
          clearAdCookies();
        }
      })();
    </script>
