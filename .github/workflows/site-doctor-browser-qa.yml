name: Site Doctor Handoff Browser QA

on:
  workflow_dispatch:
  push:
    branches:
      - feat/site-doctor-lead-handoff-20261016

permissions:
  contents: read

concurrency:
  group: site-doctor-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    name: Browser handoff (mocked providers)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build static site
        run: |
          npm ci
          npm run build
      - name: Install Playwright outside production dependencies
        run: |
          npm install --prefix .qa-tools --no-save --ignore-scripts playwright@1.64.0
          .qa-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Test staged UI and mocked lead transfer
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/narzedzia/ -o /dev/null && break
            sleep 1
          done
          node scripts/site-doctor-handoff-browser-qa.mjs
      - name: Save mobile and desktop QA screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-doctor-browser-screenshots-${{ github.run_id }}
          path: qa-results/site-doctor/
          if-no-files-found: warn
          retention-days: 14
