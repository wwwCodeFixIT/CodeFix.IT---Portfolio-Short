name: Site Doctor Handoff Browser QA

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feat/site-doctor-lab2-20261016
      - feat/site-doctor-lead-handoff-20261016
    paths:
      - 'src/main.tsx'
      - 'src/lib/tool-availability.ts'
      - 'functions/api/tool-status.ts'
      - 'scripts/tool-availability-qa.mjs'
      - 'src/components/MeasurementConsent.tsx'
      - 'src/components/MeasurementConsent.css'
      - 'scripts/privacy-settings-qa.mjs'
      - 'src/components/SiteDoctor.tsx'
      - 'src/components/SiteDoctor.css'
      - 'src/components/SiteDoctorDialog.tsx'
      - 'src/components/SiteDoctorDialog.css'
      - 'src/components/ToolControls.css'
      - 'src/pages/ToolsLab.tsx'
      - 'src/pages/ToolsLab.css'
      - 'src/components/AutomationMap.tsx'
      - 'src/components/AutomationMap.css'
      - 'src/lib/automation-map.ts'
      - 'scripts/automation-map-qa.mjs'
      - 'src/pages/HomepageV1.tsx'
      - 'src/pages/HomepageV1.css'
      - 'src/lib/site-doctor-handoff.ts'
      - 'scripts/site-doctor-handoff-browser-qa.mjs'
      - '.github/workflows/site-doctor-browser-qa.yml'

permissions:
  contents: read

concurrency:
  group: site-doctor-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    name: Browser handoff (mocked providers)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build static site
        run: |
          npm ci
          npm run build
      - name: Install Playwright outside production dependencies
        run: |
          npm install --prefix .qa-tools --no-save --ignore-scripts playwright@1.64.0
          .qa-tools/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Test staged UI and mocked lead transfer
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/narzedzia/ -o /dev/null && break
            sleep 1
          done
          node scripts/site-doctor-handoff-browser-qa.mjs
          node scripts/automation-map-qa.mjs
          node scripts/privacy-settings-qa.mjs
          node scripts/tool-availability-qa.mjs
      - name: Save mobile and desktop QA screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-doctor-browser-screenshots-${{ github.run_id }}
          path: qa-results/site-doctor/
          if-no-files-found: warn
          retention-days: 14
      - name: Save availability QA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tool-availability-qa-${{ github.run_id }}
          path: qa-results/tool-availability/
          if-no-files-found: error
          retention-days: 14
      - name: Save privacy settings QA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: privacy-settings-qa-${{ github.run_id }}
          path: qa-results/privacy-settings/
          if-no-files-found: error
          retention-days: 14
      - name: Save automation map QA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-map-qa-${{ github.run_id }}
          path: qa-results/automation-map/
          if-no-files-found: error
          retention-days: 14
