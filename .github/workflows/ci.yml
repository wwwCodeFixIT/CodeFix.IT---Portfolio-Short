name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint production graph
        run: npm run lint:production

      - name: Check formatting
        run: npm run format:check

      - name: Build project
        run: npm run build

      - name: Check static SEO pages and internal links
        run: npm run seo:static

      - name: Check conversion measurement contract
        run: npm run measurement:smoke

      - name: Check estimator and guide catalog
        run: npm run estimator:smoke

      - name: Check hero pointer motion
        run: npm run hero:smoke

      - name: Type-check Site Doctor API
        run: npm run doctor:typecheck

      - name: Type-check AI brief API
        run: npm run brief:typecheck

      - name: Validate AI brief provider contract
        run: npm run brief:smoke

      - name: Validate read-only deployment probe
        run: npm run tools:probe:smoke

      - name: Validate tool availability and API gates
        run: npm run tools:status:typecheck && npm run tools:status:smoke

      - name: Run Site Doctor API security smoke
        run: npm run doctor:smoke

      - name: Verify fail-closed Site Doctor canary without calling providers
        run: npm run doctor:activation:smoke

      - name: Verify private pilot scope, token isolation and public-off status
        run: npm run doctor:pilot:smoke

      - name: Verify D1 single-use pilot concurrency and fail-closed gate
        run: npm run doctor:one-shot:smoke

      - name: Verify opt-in WAF probe only sends mocked GET requests
        run: node scripts/site-doctor-waf-get-only-smoke.mjs

      - name: Verify D1 SQLite migration using real concurrent transactions
        run: python3 scripts/site-doctor-d1-migration-qa.py

      - name: Validate Site Doctor contact handoff
        run: npm run doctor:handoff:smoke

      - name: Validate automation map plans
        run: npm run automation:smoke

      - name: Check mobile contact CTA regression
        run: node scripts/mobile-cta-smoke.mjs

      - name: Check build budgets
        run: node scripts/check-build-budgets.mjs
