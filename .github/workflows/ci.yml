name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build project
        run: npm run build

      - name: Check build budgets
        shell: bash
        run: |
          js_bytes=$(find dist/assets -type f -name '*.js' -printf '%s\n' | awk '{sum += $1} END {print sum+0}')
          css_bytes=$(find dist/assets -type f -name '*.css' -printf '%s\n' | awk '{sum += $1} END {print sum+0}')

          echo "JavaScript: ${js_bytes} bytes / 307200 bytes budget"
          echo "CSS: ${css_bytes} bytes / 204800 bytes budget"

          if [ "$js_bytes" -gt 307200 ]; then
            echo "JavaScript build budget exceeded"
            exit 1
          fi

          if [ "$css_bytes" -gt 204800 ]; then
            echo "CSS build budget exceeded"
            exit 1
          fi
