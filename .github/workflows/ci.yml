name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint production graph
        run: npm run lint:production

      - name: Check formatting
        run: npm run format:check

      - name: Build project
        run: npm run build

      - name: Check conversion measurement contract
        run: npm run measurement:smoke

      - name: Check mobile contact CTA regression
        run: node scripts/mobile-cta-smoke.mjs

      - name: Check build budgets
        run: node scripts/check-build-budgets.mjs
