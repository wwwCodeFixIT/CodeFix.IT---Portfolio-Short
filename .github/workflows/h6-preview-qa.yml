name: H6 Cloudflare preview comparison
on:
  push:
    branches:
      - feat/h6-hero-ambient-polish
  pull_request:
    branches:
      - main
    paths:
      - 'src/pages/HomepageV1.v3.css'
      - 'scripts/h6-preview-visual-qa.mjs'
      - '.github/workflows/h6-preview-qa.yml'
permissions:
  contents: read
concurrency:
  group: h6-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    name: Chromium / WebKit / Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project + QA-only tools
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1 lighthouse@12.8.2
          npx playwright install --with-deps chromium webkit
      - name: Compare Chromium production with Cloudflare preview
        run: node scripts/h6-preview-visual-qa.mjs
      - name: Compare WebKit production with Cloudflare preview
        run: node scripts/h6-preview-visual-qa.mjs --webkit
      - name: Lighthouse mobile production
        run: npx lighthouse https://codefix.it/ --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility --output=json --output-path=artifacts/h6/lighthouse-live-mobile.json
      - name: Lighthouse mobile preview
        run: npx lighthouse https://feat-h6-hero-ambient-polish.codefix-it---portfolio-short.pages.dev/ --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility --output=json --output-path=artifacts/h6/lighthouse-preview-mobile.json
      - name: Lighthouse desktop production
        run: npx lighthouse https://codefix.it/ --preset=desktop --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility --output=json --output-path=artifacts/h6/lighthouse-live-desktop.json
      - name: Lighthouse desktop preview
        run: npx lighthouse https://feat-h6-hero-ambient-polish.codefix-it---portfolio-short.pages.dev/ --preset=desktop --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility --output=json --output-path=artifacts/h6/lighthouse-preview-desktop.json
      - name: Print Lighthouse comparison
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for(const side of ['live','preview']) for(const device of ['mobile','desktop']){
            const file = 'artifacts/h6/lighthouse-'+side+'-'+device+'.json';
            try {
              const a=JSON.parse(readFileSync(file,'utf8'));
              const metric=k=>a.audits[k]?.numericValue;
              console.log('LIGHTHOUSE '+side+' '+device+' performance='+Math.round(a.categories.performance.score*100)+' accessibility='+Math.round(a.categories.accessibility.score*100)+' LCP='+metric('largest-contentful-paint')+' CLS='+metric('cumulative-layout-shift')+' TBT='+metric('total-blocking-time'));
            }catch(err){console.log('LIGHTHOUSE NOT RUN '+file+' '+String(err).slice(0,120))}
          }
          NODE
      - name: Upload QA artifacts and screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h6-visual-comparison
          path: artifacts/h6/
          retention-days: 7
