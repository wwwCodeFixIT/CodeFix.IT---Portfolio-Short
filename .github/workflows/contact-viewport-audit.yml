name: Contact Viewport Audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/contact-viewport-audit.yml'
      - 'scripts/contact-viewport-qa.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contact-viewport-${{ github.ref }}
  cancel-in-progress: true

env:
  AUDIT_SITE_URL: https://320773b5.codefix-it---portfolio-short.pages.dev/
  AUDIT_RUNTIME_COMMIT: eff52f9e298a9fdfc311ae1da021b5f91818a35f
  AUDIT_EXPECTED_ENTRY: /assets/index-BxGA2aCr.js

jobs:
  viewport:
    name: Contact fields after viewport resize
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test tools outside application dependencies
        run: npm install --prefix .qa-tools --no-save --ignore-scripts playwright@1.64.0
      - name: Install WebKit and system dependencies
        run: .qa-tools/node_modules/.bin/playwright install --with-deps webkit
      - name: Check deployed contact viewport geometry
        run: node scripts/wait-preview-audit.mjs && node scripts/contact-viewport-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contact-viewport-${{ github.run_id }}
          path: qa-results/contact-viewport/
          if-no-files-found: error
          retention-days: 14
