name: SEO Production Smoke

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Crawlability & indexability
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run production SEO smoke
        env:
          SITE_URL: https://codefix.it
        run: node scripts/seo-production-smoke.mjs
