name: SEO Production Smoke

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Crawlability & indexability
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run production SEO smoke
        env:
          SITE_URL: https://codefix.it
        run: node scripts/seo-production-smoke.mjs

  navigation:
    name: Mobile navigation on production
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install isolated browser test tools
        run: npm install --prefix .qa-tools --no-save --ignore-scripts playwright@1.64.0
      - name: Install Chromium, WebKit and system dependencies
        run: .qa-tools/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verify published mobile navigation without submitting forms
        env:
          CODEFIX_NAVIGATION_PRODUCTION: '1'
        run: node scripts/mobile-navigation-qa.mjs
      - name: Verify deployed tool functions without calling providers
        run: node scripts/tools-deployment-smoke.mjs
      - name: Verify published local tools without write requests
        run: node scripts/tools-production-qa.mjs
      - name: Verify homepage laboratory without write requests
        env:
          CODEFIX_HOME_LAB_PRODUCTION: '1'
        run: node scripts/home-laboratory-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-laboratory-production-${{ github.run_id }}
          path: qa-results/home-laboratory-production/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tools-production-${{ github.run_id }}
          path: qa-results/tools-production/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-navigation-production-${{ github.run_id }}
          path: qa-results/mobile-navigation-production/
          if-no-files-found: error
          retention-days: 14
