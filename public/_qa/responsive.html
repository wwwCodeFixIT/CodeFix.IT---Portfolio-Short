<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>CodeFix.IT — kontrola układu</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #19191d; color: #fff; font: 14px system-ui, sans-serif; }
      header { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; padding: 12px; }
      button { padding: 10px 14px; border: 1px solid #777; border-radius: 8px; color: #fff; background: #26262a; cursor: pointer; }
      button[aria-pressed="true"] { border-color: #ff9a9e; background: #6c171c; }
      button:focus-visible { outline: 3px solid #ff9a9e; outline-offset: 3px; }
      main { display: flex; justify-content: center; padding: 0 16px 16px; }
      iframe { flex: 0 0 auto; width: 390px; height: 844px; border: 0; outline: 1px solid #666; border-radius: 12px; background: #060606; }
      p { text-align: center; margin: 0 12px 10px; color: #ccc; font-size: 12px; }
    </style>
  </head>
  <body>
    <header aria-label="Szerokość obszaru strony">
      <strong>CodeFix.IT · kontrola układu</strong>
      <button type="button" data-width="320" aria-pressed="false">320 px</button>
      <button type="button" data-width="375" aria-pressed="false">375 px</button>
      <button type="button" data-width="390" aria-pressed="true">390 px</button>
      <button type="button" data-width="430" aria-pressed="false">430 px</button>
      <button type="button" data-width="768" aria-pressed="false">768 px</button>
    </header>
    <p>Ten widok używa zbudowanego kodu strony. Wysyłanie formularza jest wyłączone.</p>
    <main><iframe title="Mobilny podgląd CodeFix.IT"></iframe></main>
    <script type="module">
      const frame = document.querySelector('iframe');
      for (const button of document.querySelectorAll('[data-width]')) {
        button.addEventListener('click', () => {
          frame.style.width = `${button.dataset.width}px`;
          for (const item of document.querySelectorAll('[data-width]')) {
            item.setAttribute('aria-pressed', String(item === button));
          }
        });
      }
      // Create a standalone QA document from compiled assets. No live page is embedded;
      // deployed anti-framing headers and the product's source stay unchanged.
      const response = await fetch('/');
      if (!response.ok) throw new Error(`Cannot load build manifest: ${response.status}`);
      const documentCopy = new DOMParser().parseFromString(await response.text(), 'text/html');
      const entry = documentCopy.querySelector('script[type="module"][src]');
      if (!entry) throw new Error('Missing production entry');
      const styles = [...documentCopy.querySelectorAll('link[rel="stylesheet"]')]
        .map((link) => link.outerHTML).join('');
      const setup = `
        window.codefixConsentChoice = 'rejected';
        window.codefixAdConsentChoice = 'rejected';
        window.codefixAnalyticsAllowed = false;
        window.addEventListener('click', event => {
          const anchor = event.target.closest?.('a[href^="#"]');
          if (!anchor) return;
          const target = document.getElementById(anchor.getAttribute('href').slice(1));
          if (target) {
            event.preventDefault();
            target.scrollIntoView({ behavior: 'auto' });
          }
        });
        window.addEventListener('submit', event => {
          event.preventDefault();
          event.stopImmediatePropagation();
        }, true);
      `;
      frame.srcdoc = `<!doctype html><html lang="pl"><head>
        <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="robots" content="noindex, nofollow"><base href="${location.origin}/">
        <title>CodeFix.IT — responsive QA</title>${styles}
        <style>::-webkit-scrollbar { width: 0; height: 0; }</style>
        <script>${setup}<\/script>
        </head><body><div id="root"></div>${entry.outerHTML}</body></html>`;
    </script>
  </body>
</html>
