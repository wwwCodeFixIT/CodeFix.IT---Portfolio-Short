<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#060606" />
    <title>404 — Strona nie istnieje | CodeFix.IT</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #060606; color: #f5f5f5; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      main { width: min(680px, 100%); border: 1px solid #2a2a2a; border-radius: 20px; padding: clamp(28px, 6vw, 56px); background: #0d0d0d; }
      p { color: #b8b8b8; line-height: 1.7; }
      a { display: inline-flex; margin-top: 12px; padding: 12px 18px; border-radius: 10px; background: #ef4444; color: #fff; text-decoration: none; font-weight: 700; }
      a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #ef4444; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">HTTP 404</p>
      <h1>Ta strona nie istnieje.</h1>
      <p>Adres mógł się zmienić albo zawiera literówkę. Wróć na stronę główną CodeFix.IT i wybierz właściwy zakres.</p>
      <a href="/">Wróć na codefix.it</a>
    </main>
  </body>
</html>
