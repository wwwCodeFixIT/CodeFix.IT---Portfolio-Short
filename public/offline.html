<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - CodeFix.IT</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      padding: 20px;
    }
    
    .container {
      text-align: center;
      max-width: 500px;
    }
    
    .icon {
      font-size: 80px;
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.95); }
    }
    
    h1 {
      font-size: 2rem;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #dc2626, #f87171);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    p {
      color: #a1a1aa;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(220, 38, 38, 0.3);
    }
    
    .contact-info {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid #27272a;
    }
    
    .contact-info p {
      margin-bottom: 8px;
      font-size: 0.9rem;
    }
    
    .contact-info a {
      color: #dc2626;
      text-decoration: none;
    }
    
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 48px;
    }
    
    .logo span {
      color: #dc2626;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Code<span>Fix</span>.IT</div>
    
    <div class="icon">📡</div>
    
    <h1>Jesteś offline</h1>
    
    <p>
      Wygląda na to, że nie masz połączenia z internetem. 
      Sprawdź swoje połączenie i spróbuj ponownie.
    </p>
    
    <button class="btn" onclick="window.location.reload()">
      🔄 Spróbuj ponownie
    </button>
    
    <div class="contact-info">
      <p>Możesz też skontaktować się bezpośrednio:</p>
      <p>📧 <a href="mailto:wwwcodefixit@gmail.com">wwwcodefixit@gmail.com</a></p>
      <p>📱 <a href="tel:+48883667943">+48 883 667 943</a></p>
    </div>
  </div>
  
  <script>
    // Check for online status
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
